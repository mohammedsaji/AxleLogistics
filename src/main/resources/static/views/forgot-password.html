<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="/styles/forgotPassword.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="password-forgot">
    <header class="password-forgot-header">
        <div class="password-forgot-header-brand">
            <img class="password-forgot-header-logo" src="" alt="Passage Logistic Systems">
        </div>
    </header>

    <main class="password-forgot-body">
        <section class="password-forgot-form">
            <h2>Reset Password</h2>
            <p>Enter your registered email address to reset your password.</p>

            <form id="password-forgot-form">
                <div>
                    <label for="signed-up-user-email-id">Email Address</label>
                    <input type="email" id="signed-up-user-email-id" placeholder="Enter your email address" required>
                </div>

                <button type="submit" id="password-forgot-btn">Send Reset Email</button>
            </form>
        </section>
    </main>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../js/utility/customAlert.js"></script>
<script src="/js/ajaxCalls/ajaxCalls.js"></script>
<script src="/js/forgotPassword.js"></script>
</body>
</html>
