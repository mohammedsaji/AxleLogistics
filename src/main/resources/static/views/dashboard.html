<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passage Logistics Systems</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>
<div class="dashboard">

    <header class="dashboard-header">

        <div class="dashboard-header-brand">
            <img class="dashboard-header-logo" src="" alt="Dashboard">
        </div>


        <nav class="dashboard-navigation" aria-label="Main navigation">

            <div class="dashboard-navigation-group" id="dashboard-nav-shipment">
                <button type="button" id="dashboard-nav-shipment-btn">Shipments</button>
                <div class="dashboard-navigation-menu" id="dashboard-nav-shipment-menu">
                    <button type="button" id="dashboard-nav-shipment-entry-btn">Enter Shipment</button>
                    <button type="button" id="dashboard-nav-shipment-manage-btn">Manage Shipments</button>
                </div>
            </div>

            <div class="dashboard-navigation-group" id="dashboard-nav-employee">
                <button type="button" id="dashboard-nav-employee-btn">Employees</button>
                <div class="dashboard-navigation-menu" id="dashboard-nav-employee-menu">
                    <button type="button" id="dashboard-nav-employee-create-btn">Create Employee</button>
                    <button type="button" id="dashboard-nav-employee-manage-btn">Manage Employees</button>
                </div>
            </div>


            <div class="dashboard-navigation-group" id="dashboard-nav-partner">
                <button type="button" id="dashboard-nav-partner-btn">Partners</button>
                <div class="dashboard-navigation-menu" id="dashboard-nav-partner-menu">
                    <button type="button" id="dashboard-nav-operator-manage-btn">Manage Operators</button>
                    <button type="button" id="dashboard-nav-partner-register-btn">Register Partner</button>
                </div>
            </div>
        </nav>


        <div class="dashboard-header-actions">
            <div class="dashboard-header-account-actions">
                <button type="button" id="profile-view-btn">View Profile</button>
                <button type="button" id="sign-out-btn">Sign out</button>
            </div>
        </div>
    </header>

    <main class="dashboard-body">
        <h1>Dashboard</h1>
    </main>

    <footer class="footer">
        <div class="footer-profile-section"><a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>

</div>

<script src="/js/ajaxCalls/ajaxCalls.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
